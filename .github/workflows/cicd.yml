name: SecondChance CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install backend dependencies
        working-directory: secondChance-backend
        run: npm install

      - name: Verify backend syntax
        working-directory: secondChance-backend
        run: node --check app.js

      - name: Install sentiment dependencies
        working-directory: sentiment
        run: npm install

      - name: Verify sentiment syntax
        working-directory: sentiment
        run: node --check index.js

      - name: Install frontend dependencies
        working-directory: secondChance-frontend
        run: npm install

      - name: Build frontend
        working-directory: secondChance-frontend
        run: npm run build
